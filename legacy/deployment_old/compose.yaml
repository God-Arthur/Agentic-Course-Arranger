name: ai-course-planner

services:
  planner:
    build:
      context: .
      dockerfile: Dockerfile
      # 取包要翻代理的机器：BUILD_PROXY=http://127.0.0.1:7890 且 BUILD_NETWORK=host
      # （host 网络下 127.0.0.1 才指得到宿主的代理）。正常联网机器两个都不设，走默认桥接。
      network: ${BUILD_NETWORK:-default}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        APP_VERSION: ${APP_VERSION:-local}
        PIP_ADDITIONAL_ARGS: ${PIP_ADDITIONAL_ARGS:-}
        APT_MIRROR: ${APT_MIRROR:-}
        # 用 `${VAR-default}` 而不是 `${VAR:-default}`：设成空值就是要跳过 apt 那一层，
        # 带冒号的写法会把空值也当成"未设置"而填回默认包列表。
        APT_PACKAGES: ${APT_PACKAGES-libgomp1 tzdata ca-certificates}
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    image: ai-course-planner:${APP_VERSION:-local}
    restart: unless-stopped
    # 没有 .env 也能起：规则机制不需要密钥。
    # 注意：env_file 的值会被 `docker compose config` 原样渲染出来（实测如此），所以不要把密钥写进 .env
    # 又指望它不出现。要避开这条，把密钥放成一个只读文件、用下面注释掉的那行挂进来，
    # 并设 OPENAI_API_KEY_FILE；应用会先读环境变量、再读该文件。
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-20}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-1}
      SOLVER_MAX_SECONDS: ${SOLVER_MAX_SECONDS:-6}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 默认只绑宿主回环：这个应用没有身份认证，公开监听等于把"谁能改预置"交给整网。
      # 确实要给同局域网的人看，显式设 PLANNER_BIND_IP=0.0.0.0 并接受无认证的事实（见 DEPLOYMENT.md 第 8 节）。
      - "${PLANNER_BIND_IP:-127.0.0.1}:${PLANNER_HOST_PORT:-8501}:8501"
    volumes:
      - planner_data:/app/data
      - planner_cache:/app/semantic_cache
      - planner_logs:/app/logs
      - planner_outputs:/app/outputs
      # 真实学生 .skill 与课程表格放进宿主 ./inputs，容器内以只读挂在 /app/inputs；
      # 界面的“表格目录”填 inputs/<你的目录> 即可，越出 /app 的路径会被拒绝。
      - ${SKILL_INPUT_DIR:-./inputs}:/app/inputs:ro
      # 不想让密钥出现在 .env（因而出现在 compose config 输出里）时，取消注释这一行并设
      # LLM_KEY_FILE=/绝对路径/含密钥的文件 + OPENAI_API_KEY_FILE=/run/secrets/openai_api_key：
      # - ${LLM_KEY_FILE:-./secrets/openai_api_key.txt}:/run/secrets/openai_api_key:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as r; raise SystemExit(0 if r.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

volumes:
  planner_data:
  planner_cache:
  planner_logs:
  planner_outputs:
